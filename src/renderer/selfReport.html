<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Focus Forecast</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; color: #222; user-select: none; }
    p { margin: 0 0 12px; font-size: 14px; }
    .buttons { display: flex; gap: 8px; }
    button { flex: 1; padding: 10px 0; font-size: 16px; border: 1px solid #ccc; border-radius: 6px;
             background: #f6f6f6; cursor: pointer; }
    button:hover { background: #e3ecff; border-color: #6b8fe8; }
    .scale { display: flex; justify-content: space-between; color: #888; font-size: 11px; margin-top: 6px; }
  </style>
</head>
<body>
  <p id="question"></p>
  <div class="buttons">
    <button data-rating="1">1</button>
    <button data-rating="2">2</button>
    <button data-rating="3">3</button>
    <button data-rating="4">4</button>
    <button data-rating="5">5</button>
  </div>
  <div class="scale"><span>not at all</span><span>very focused</span></div>

  <script src="selfReport.js"></script>
</body>
</html>
