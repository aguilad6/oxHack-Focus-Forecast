<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Focus Forecast</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; padding: 14px 16px 12px;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      color: #e8ebf2; background: #161c2a;
      border: 1px solid #2b3448; border-radius: 12px;
      user-select: none;
      -webkit-app-region: drag; /* the window has no title bar, so drag it by its background */
    }
    button { -webkit-app-region: no-drag; font: inherit; cursor: pointer; }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .brand { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8b93a7; }
    .close { background: none; border: none; color: #8b93a7; font-size: 16px; line-height: 1; padding: 2px 4px; }
    .close:hover { color: #e8ebf2; }
    p { margin: 0 0 12px; font-size: 14px; line-height: 1.35; }
    .buttons { display: flex; gap: 8px; }
    .buttons button { flex: 1; padding: 9px 0; font-size: 15px; font-weight: 600; color: #e8ebf2;
                      background: #0f1522; border: 1px solid #2b3448; border-radius: 8px; }
    .buttons button:hover { background: #6c8cff; border-color: #6c8cff; }
    .scale { display: flex; justify-content: space-between; color: #8b93a7; font-size: 11px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="head">
    <span class="brand">Focus Forecast</span>
    <button class="close" id="close" title="Skip">×</button>
  </div>
  <p id="question"></p>
  <div class="buttons">
    <button data-rating="1">1</button>
    <button data-rating="2">2</button>
    <button data-rating="3">3</button>
    <button data-rating="4">4</button>
    <button data-rating="5">5</button>
  </div>
  <div class="scale"><span>not at all</span><span>very focused</span></div>

  <script src="selfReport.js"></script>
</body>
</html>
