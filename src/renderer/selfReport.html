<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Focus Forecast</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; padding: 12px 16px 12px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #1d1b18;
      background: #f6f3ec; border: 1px solid #ddd6c8; border-top: 3px solid #1d1b18; border-radius: 6px;
      user-select: none;
      -webkit-app-region: drag; /* the window has no title bar, so drag it by its background */
    }
    button { -webkit-app-region: no-drag; font: inherit; cursor: pointer; }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .brand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 13px; font-weight: 600; }
    .close { background: none; border: none; color: #a39d92; font-size: 18px; line-height: 1; padding: 0 2px; }
    .close:hover { color: #1d1b18; }
    p { margin: 0 0 10px; font-size: 14px; line-height: 1.35; }
    .buttons { display: flex; gap: 6px; }
    .buttons button { flex: 1; padding: 8px 0; font-size: 15px; font-weight: 600; color: #1d1b18;
                      background: #fffdf8; border: 1px solid #ddd6c8; border-radius: 3px; }
    .buttons button:hover { background: #1d1b18; border-color: #1d1b18; color: #f6f3ec; }
    .scale { display: flex; justify-content: space-between; color: #6f6a60; font-size: 11px; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="head">
    <span class="brand">Focus Forecast</span>
    <button class="close" id="close" title="Skip">×</button>
  </div>
  <p id="question"></p>
  <div class="buttons">
    <button data-rating="1">1</button>
    <button data-rating="2">2</button>
    <button data-rating="3">3</button>
    <button data-rating="4">4</button>
    <button data-rating="5">5</button>
  </div>
  <div class="scale"><span>Not at all</span><span>Very focused</span></div>

  <script src="selfReport.js"></script>
</body>
</html>
