<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Focus Forecast · Calibration</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; cursor: none; user-select: none;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #1d1b18; background: #f6f3ec;
    }
    .target { position: relative; width: 120px; height: 120px; display: grid; place-items: center; }
    .dot { width: 16px; height: 16px; border-radius: 50%; background: #c2532d; }
    /* Ring shrinks onto the dot over the measuring time (duration set from the URL in calibrate.js) */
    .ring { position: absolute; inset: 0; border: 2px solid #1d1b18; border-radius: 50%; animation: shrink linear forwards; }
    @keyframes shrink { from { transform: scale(1); opacity: 1; } to { transform: scale(0.15); opacity: 0.15; } }
    .text { position: absolute; bottom: 12%; width: 100%; text-align: center; }
    .text h1 { margin: 0 0 6px; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
               font-size: 30px; font-weight: 600; }
    .text p { margin: 0; color: #6f6a60; }
  </style>
</head>
<body>
  <div class="target"><div class="ring" id="ring"></div><div class="dot"></div></div>
  <div class="text">
    <h1>Look at the dot</h1>
    <p id="progress"></p>
  </div>
  <script src="calibrate.js"></script>
</body>
</html>
